# M-Audio M-Game RGB Dual: divide la salida y la entrada USB de 8 canales.
# Generado por el plugin io.github.crisesarmiento.mgame-mixer; no lo edites a mano.
# mgame-pairs: FL FR,FC LFE,RL RR,SL SR,FL FR,FC LFE,RL RR,SL SR
context.modules = [
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Game"
      capture.props  = { node.name = "mgame_game" media.class = "Audio/Sink" audio.position = [ FL FR ] }
      playback.props = { node.name = "mgame_game.out" audio.position = [ FL FR ]
                         target.object = "alsa_output.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Chat"
      capture.props  = { node.name = "mgame_chat" media.class = "Audio/Sink" audio.position = [ FL FR ] }
      playback.props = { node.name = "mgame_chat.out" audio.position = [ FC LFE ]
                         target.object = "alsa_output.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Sampler"
      capture.props  = { node.name = "mgame_sampler" media.class = "Audio/Sink" audio.position = [ FL FR ] }
      playback.props = { node.name = "mgame_sampler.out" audio.position = [ RL RR ]
                         target.object = "alsa_output.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game System"
      capture.props  = { node.name = "mgame_system" media.class = "Audio/Sink" audio.position = [ FL FR ] }
      playback.props = { node.name = "mgame_system.out" audio.position = [ SL SR ]
                         target.object = "alsa_output.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Stream (in)"
      capture.props  = { node.name = "mgame_in_stream.capture" audio.position = [ FL FR ]
                         target.object = "alsa_input.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
      playback.props = { node.name = "mgame_in_stream" media.class = "Audio/Source" audio.position = [ FL FR ] }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Alt (in)"
      capture.props  = { node.name = "mgame_in_alt.capture" audio.position = [ FC LFE ]
                         target.object = "alsa_input.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
      playback.props = { node.name = "mgame_in_alt" media.class = "Audio/Source" audio.position = [ FL FR ] }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Chat (in)"
      capture.props  = { node.name = "mgame_in_chat.capture" audio.position = [ RL RR ]
                         target.object = "alsa_input.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
      playback.props = { node.name = "mgame_in_chat" media.class = "Audio/Source" audio.position = [ FL FR ] }
    }
  }
  { name = libpipewire-module-loopback
    args = {
      node.description = "M-Game Sampler (in)"
      capture.props  = { node.name = "mgame_in_sampler.capture" audio.position = [ SL SR ]
                         target.object = "alsa_input.usb-M-Audio_M-Game_RGB_Dual_Streaming_Port-01.analog-surround-71"
                         stream.dont-remix = true node.passive = true }
      playback.props = { node.name = "mgame_in_sampler" media.class = "Audio/Source" audio.position = [ FL FR ] }
    }
  }
]
