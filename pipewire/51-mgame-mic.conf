# Cadena de procesado del micrófono (RNNoise, EQ, compresor, gate).
# Generado por el plugin io.github.crisesarmiento.mgame-mixer; no lo edites a mano.
# La entrada es la fuente "M-Game Alt (in)", mezclada a mono.
context.modules = [
  { name = libpipewire-module-filter-chain
    args = {
      node.description = "M-Game Mic (processed)"
      media.name       = "M-Game Mic (processed)"
      audio.rate       = 48000
      filter.graph = {
        nodes = [
          { type = ladspa name = rnn plugin = librnnoise_ladspa label = noise_suppressor_mono
            control = { "VAD Threshold (%)" = 50 "VAD Grace Period (ms)" = 300 "Retroactive VAD Grace (ms)" = 0 "Dry Mix" = 0 } }
          { type = builtin name = hpf label = bq_highpass control = { "Freq" = 80.0 "Q" = 0.707 } }
          { type = builtin name = mud label = bq_peaking control = { "Freq" = 300.0 "Q" = 1.0 "Gain" = -1.0 } }
          { type = builtin name = presence label = bq_peaking control = { "Freq" = 3000.0 "Q" = 0.9 "Gain" = 2.0 } }
          { type = builtin name = air label = bq_highshelf control = { "Freq" = 9000.0 "Q" = 0.707 "Gain" = 0.0 } }
          { type = ladspa name = comp plugin = lsp-plugins-ladspa label = "http://lsp-plug.in/plugins/ladspa/compressor_mono"
            control = { "Bypass" = 0 "Compression mode" = 0 "Attack threshold (G)" = 0.1 "Ratio" = 2.0 "Attack time (ms)" = 15.0 "Release time (ms)" = 150.0 "Knee (G)" = 0.501196 "Makeup gain (G)" = 1.258925 } }
          { type = ladspa name = gate plugin = lsp-plugins-ladspa label = "http://lsp-plug.in/plugins/ladspa/gate_mono"
            control = { "Bypass" = 1 "Curve threshold (G)" = 0.003162 "Attack (ms)" = 5.0 "Release (ms)" = 150.0 "Hold time (ms)" = 50.0 "Reduction (G)" = 1.0 } }
        ]
        links = [
          { output = "rnn:Output"      input = "hpf:In" }
          { output = "hpf:Out"         input = "mud:In" }
          { output = "mud:Out"         input = "presence:In" }
          { output = "presence:Out"    input = "air:In" }
          { output = "air:Out"         input = "comp:Input" }
          { output = "comp:Output"     input = "gate:Input" }
        ]
        inputs  = [ "rnn:Input" ]
        outputs = [ "gate:Output" ]
      }
      capture.props = {
        node.name = "mgame_mic.capture"
        target.object = "mgame_in_alt"
        audio.position = [ MONO ]
        node.passive = true
      }
      playback.props = {
        node.name = "mgame_mic_processed"
        media.class = "Audio/Source"
        audio.position = [ MONO ]
      }
    }
  }
]
